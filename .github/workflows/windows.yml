name: Windows checks and portable executable
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pyinstaller==6.12.0
      - name: Behavior and offscreen GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build portable app
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name GlassesMandu --add-data "assets;assets" run_pet.py
      - uses: actions/upload-artifact@v4
        with:
          name: GlassesMandu-Windows
          path: dist/GlassesMandu/
