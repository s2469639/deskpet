[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "glasses-mandu"
version = "0.1.0"
description = "조용히 곁에 머무는 안경만두 데스크톱 펫"
requires-python = ">=3.10"
dependencies = ["PySide6==6.8.3"]

[project.gui-scripts]
deskpet = "deskpet.app:main"

[tool.setuptools.packages.find]
include = ["deskpet*"]
